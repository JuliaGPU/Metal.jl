# Commit message tags select what to run: `[only X]` runs only the listed steps, `[skip X]`
# skips them, where X is a comma-separated list of: `tests` (everything but docs and
# benchmarks), `julia` (released Julia versions), `nightly`, `special`, `validation`, `docs`,
# `benchmarks`. Draft pull requests only test the newest Julia release and nightly, unless
# steps are selected explicitly. See also GPUCompiler.jl's CI, which uses the same tags.
steps:
  - group: ":julia: Julia"
    key: "julia"
    steps:
      # the newest release, also tested on draft pull requests
      - &julia
        label: "Julia {{matrix.julia}}"
        plugins:
          - JuliaCI/julia#v1:
              version: "{{matrix.julia}}"
          - JuliaCI/julia-test#v1:
              test_args: "--quickfail --all --verbose"
          - JuliaCI/julia-coverage#v1:
              codecov: true
              dirs:
                - src
                - lib
        agents:
          queue: "metal"
        if: |
          build.message !~ /\[skip [^\]]*(tests|julia)/ &&
          (build.message =~ /\[only [^\]]*(tests|julia)/ || build.message !~ /\[only /)
        timeout_in_minutes: 60
        matrix:
          setup:
            julia:
              - "1.13"

      # older releases
      - <<: *julia
        if: |
          build.message !~ /\[skip [^\]]*(tests|julia)/ &&
          (build.message =~ /\[only [^\]]*(tests|julia)/ ||
           build.message !~ /\[only / && !build.pull_request.draft)
        matrix:
          setup:
            julia:
              - "1.10"
              - "1.11"
              - "1.12"

      - <<: *julia
        if: |
          build.message !~ /\[skip [^\]]*(tests|nightly)/ &&
          (build.message =~ /\[only [^\]]*(tests|nightly)/ || build.message !~ /\[only /)
        soft_fail: true
        matrix:
          setup:
            julia:
              - "nightly"

  # special tests
  - group: ":eyes: Special"
    depends_on: "julia"
    steps:
      - label: ":floppy_disk: Shared Storage"
        plugins:
          - JuliaCI/julia#v1:
              version: "1.13"
          - JuliaCI/julia-test#v1:
              test_args: "--quickfail --all --verbose"
        agents:
          queue: "metal"
        if: |
          build.message !~ /\[skip [^\]]*(tests|special)/ &&
          (build.message =~ /\[only [^\]]*(tests|special)/ ||
           build.message !~ /\[only / && !build.pull_request.draft)
        timeout_in_minutes: 60
        commands: |
          echo -e "[Metal]\ndefault_storage = \"shared\"" >LocalPreferences.toml
      - label: ":mag: API validation"
        plugins:
          - JuliaCI/julia#v1:
              version: "1.13"
          - JuliaCI/julia-test#v1:
              test_args: "--jobs=1 --quickfail --verbose --validate"
          - JuliaCI/julia-coverage#v1:
              codecov: true
              dirs:
                - src
                - lib
        commands: |
          # blocking synchronization is easier to validate
          echo -e "[Metal]\nnonblocking_synchronization = false" >LocalPreferences.toml
        agents:
          queue: "metal"
        if: |
          build.message !~ /\[skip [^\]]*(tests|special|validation)/ &&
          (build.message =~ /\[only [^\]]*(tests|special|validation)/ ||
           build.message !~ /\[only / && !build.pull_request.draft)
        timeout_in_minutes: 60
      # - label: ":ram: Large buffers"
      #   plugins:
      #     - JuliaCI/julia#v1:
      #         version: "1.13"
      #     - JuliaCI/julia-test#v1:
      #         test_args: "--quickfail --verbose large"
      #     - JuliaCI/julia-coverage#v1:
      #         codecov: true
      #         dirs:
      #           - src
      #           - lib
      #   env:
      #     MTL_DEBUG_LAYER: '1'
      #     MTL_SHADER_VALIDATION: '1'
      #   agents:
      #     queue: "metal"
      #   if: |
      #     build.message =~ /\[only tests\]/ ||
      #     build.message =~ /\[only large\]/ ||
      #     build.message =~ /\[only special\]/ ||
      #     build.message !~ /\[only/ && !build.pull_request.draft &&
      #       build.message !~ /\[skip tests\]/ &&
      #       build.message !~ /\[skip large\]/ &&
      #       build.message !~ /\[skip special\]/
      #   timeout_in_minutes: 15

  - label: ":books: Documentation"
    depends_on: "julia"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.13"
    command: |
      julia --project -e '
        println("--- :julia: Instantiating project")
        using Pkg
        Pkg.instantiate()
        Pkg.activate("docs")
        Pkg.instantiate()
        push!(LOAD_PATH, @__DIR__)

        println("+++ :julia: Building documentation")
        include("docs/make.jl")'
    agents:
      queue: "metal"
    if: |
      build.message !~ /\[skip [^\]]*(docs)/ &&
      (build.message =~ /\[only [^\]]*(docs)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 30

  - wait: ~
    continue_on_failure: true

  - label: ":racehorse: Benchmarks"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.13"
    command: |
      julia --project=perf -e '
        using Pkg

        println("--- :julia: Instantiating project")
        Pkg.develop([PackageSpec(path=pwd())])

        println("+++ :julia: Benchmarking")
        include("perf/runbenchmarks.jl")'
    artifact_paths:
      - "benchmarkresults.json"
    agents:
      queue: "metal"
    if: |
      build.message !~ /\[skip [^\]]*(benchmarks)/ &&
      (build.message =~ /\[only [^\]]*(benchmarks)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 30
